      <script type="module">

const lesson18 = {
  id: '18',
  title: 'Как попросить, отказаться, рассказать о своём мнении',

  fillPool: [
    { sentence: 'नई झाड़ू चाहिए, तुम मंडी जाकर ______ ।', correct: 'माँगो', other: ['माँगी', 'पूछ रही'], explanation: 'Верно. Здесь просьба во втором лице: «сходи на рынок и попроси».' },
    { sentence: 'मेरी बीवी ने उच्च गुणवत्ता की नयी साड़ी ______ है ।', correct: 'माँगी', other: ['माँगो', 'पूछ रही'], explanation: 'Точно! मेरी बीवी — женский род, поэтому माँगी: «моя жена попросила».' },
    { sentence: 'कूड़ा कौन फ़ेंकेगा और कील कौन लगायेगा, मैं तुझ से ______ हूँ ।', correct: 'पूछ रही', other: ['माँगी', 'माँगते'], explanation: 'Верно. Здесь речь о вопросе: «я спрашиваю тебя».' },
    { sentence: 'लड़केवाले दहेज के लिए एक गाड़ी और सोने के गहने ______ हैं ।', correct: 'माँगते', other: ['माँगो', 'पूछ रही'], explanation: 'Да. लड़केवाले — множественное число, поэтому माँगते.' },
    { sentence: 'कांग्रेस वाले नेता ने एक करोड़ की रिश्वत ______ थी ।', correct: 'माँगी', other: ['माँगो', 'पूछ रही'], explanation: 'Верно. रिश्वत «попросил» — माँगी.' }
  ],
  opinionPool: [
    { scenario: '«В Индии есть только 28 языков».', correct: 'मुझ को शक है ।', other: ['मुझ को भरोसा है ।', 'चलेगा!'], explanation: 'Да. मुझ को शक है — буквально «у меня есть сомнение», то есть «я сомневаюсь».' },
    { scenario: '«Хинди и урду — это один и тот же язык».', correct: 'मुझ को शक है ।', other: ['मुझ को भरोसा है ।', 'चलेगा!'], explanation: 'Верно: эта фраза выражает сомнение в утверждении.' },
    { scenario: '«Мыть волосы мылом — лучший способ».', correct: 'मुझ को शक है ।', other: ['मुझ को भरोसा है ।', 'चलेगा!'], explanation: 'Точно. Для осторожного несогласия подходит «я сомневаюсь».' }

  matchingRound: {

  document.querySelector('#progress-text').textContent = `Повтор ошибок · ${reviewIndex + 1} из ${mistakes.length}`;
  updateScoreText();
  let inner = `<p class="game-label">Финальный раунд · повтор</p><h2 class="game-title">Закрепим ещё раз</h2><p class="game-description">Эта карточка уже встречалась. Выбери правильный ответ — и урок будет пройден.</p>`;
  if (item.scenario) inner += `<div class="scenario">${item.scenario}</div>`;
  if (item.type === 'fill') inner += `<div class="sentence">${item.sentence}</div>`;
  inner += answersMarkup(item.choices, item.type === 'fill' ? 'word-options' : item.type === 'opinion' ? 'opinion' : 'choice-grid');
  card.innerHTML = inner;
  card.querySelectorAll('[data-answer]').forEach(button => button.addEventListener('click', () => reviewAnswer(Number(button.dataset.answer), button, item)));
}
function reviewAnswer(selected, button, item) {
  const correct = selected === item.answer;
  card.querySelectorAll('[data-answer]').forEach((answerButton, index) => {
    answerButton.disabled = true;
    if (index === item.answer) answerButton.classList.add('correct');
    if (answerButton === button && !correct) answerButton.classList.add('wrong');
  });
  if (correct) { score++; completed.add(mistakes[reviewIndex]); }
  showFeedback(correct, correct ? 'Готово — теперь этот ответ закреплён.' : 'Правильный вариант уже выделен. Запомни его и двигайся дальше.');
  addNext(reviewIndex === mistakes.length - 1 ? 'Посмотреть результат →' : 'Следующая ошибка →', () => {
    if (reviewIndex < mistakes.length - 1) { reviewIndex++; renderReview(); } else finish();
  });
  updateScoreText();
}
function finish() {
  const pending = rounds.findIndex((_, index) => !completed.has(index));
  if (pending !== -1) {
    completingPending = true;
    card.innerHTML = `<p class="game-label">Ещё не всё</p><h2 class="game-title">Осталось одно дело</h2><div class="finish">Чтобы завершить урок и сохранить результат, пройди все задания.</div><button class="next restart" id="continue-lesson">К незавершённому заданию</button>`;
    document.querySelector('#continue-lesson').addEventListener('click', () => { current = pending; render(); });
    return;
  }
  completingPending = false;
  saveCompletedLesson();
  progress.style.width = '100%';
  document.querySelector('#progress-text').textContent = 'Урок пройден';
  card.innerHTML = `<p class="game-label">Готово · Урок ${activeLesson.data.id}</p><h2 class="game-title">Хорошая практика!</h2><div class="finish">Твой результат: <strong>${score} из ${totalPoints()}</strong>.<br>Нажми «Пройти ещё раз» — попадутся другие фразы и порядок ответов.</div><div class="finish-actions"><button class="next restart" id="restart">Пройти ещё раз</button><button class="next catalog" id="all-lessons">Ко всем урокам</button></div>`;
  document.querySelector('#restart').addEventListener('click', () => { rounds = activeLesson.createRounds(); resetProgress(); renderNavigation(); render(); });
  document.querySelector('#all-lessons').addEventListener('click', () => openCatalog());
}
function openLesson(lessonId) {
  activeLesson = lessons[lessonId];
  saveLastOpenedLesson(lessonId);
  rounds = activeLesson.createRounds();
  resetProgress();
  updateLessonChrome();
  renderNavigation();
  appShell.classList.remove('selecting');
  render();
}
function openCatalog(event) {
  event?.preventDefault();
  appShell.classList.add('selecting');
  window.scrollTo({ top: 0, behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
}
lessonCards.forEach(cardButton => cardButton.addEventListener('click', () => openLesson(cardButton.dataset.lesson)));
continueLesson.addEventListener('click', () => openLesson(learningProgress.lastLessonId || '17'));
brand.addEventListener('click', openCatalog);
appShell.classList.add('selecting');
updateLessonChrome();
renderNavigation();
updateCatalogProgress();
render();

    </script>
  </body>
</html>
